[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "foldos"
version = "0.1.0"
description = "Event-sourced agent governance observable in SigNoz"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "agno[os]==2.8.2",
  "fastmcp==3.4.3",
  "openai==2.21.0",
  "openinference-instrumentation-agno==0.1.25",
  "opentelemetry-api==1.39.1",
  "opentelemetry-sdk==1.39.1",
  "opentelemetry-exporter-otlp-proto-http==1.39.1",
]

[project.optional-dependencies]
dev = [
  "hypothesis==6.138.13",
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "ruff==0.12.10",
]

[tool.hatch.build.targets.wheel]
packages = ["foldos"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["foldos"]
